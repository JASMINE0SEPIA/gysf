plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

def generatedShaders = layout.buildDirectory.dir('generated/shaders')
def slangCompiler = providers.gradleProperty('slangcPath').orElse(
    providers.environmentVariable('VULKAN_SDK').map { "${it}/Bin/slangc.exe" }
).orElse('slangc')

['vertex': 'vertexMain', 'fragment': 'fragmentMain'].each { stage, entry ->
    def suffix = stage == 'vertex' ? 'vert' : 'frag'
    def output = generatedShaders.map { it.file("assets/gysf/shaders/debug/world_depth.${suffix}.spv") }
    tasks.register("compileDepth${stage.capitalize()}", Exec) {
        inputs.file('shaders/debug/world_depth.slang')
        inputs.property('slangCompiler', slangCompiler)
        outputs.file(output)
        executable slangCompiler.get()
        args file('shaders/debug/world_depth.slang').absolutePath,
            '-entry', entry, '-stage', stage, '-target', 'spirv', '-profile', 'spirv_1_5',
            '-matrix-layout-column-major', '-o', output.get().asFile.absolutePath
        doFirst { output.get().asFile.parentFile.mkdirs() }
    }
}

sourceSets.main.resources.srcDir(files(generatedShaders).builtBy('compileDepthVertex', 'compileDepthFragment'))

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    filesMatching('fabric.mod.json') {
        expand inputs.properties
    }
}

loom {
    runs {
        client {
            client()
            runDir 'run'
            vmArg '--enable-native-access=ALL-UNNAMED'
            vmArg "-Dgysf.debug.gpuProbe=${providers.gradleProperty('gpuProbe').getOrElse('false')}"
            vmArg "-Dgysf.gpu.localRayQuery=${providers.gradleProperty('localRayQuery').getOrElse('true')}"
            programArgs '--offlineDeveloperMode', '--graphicsBackend', 'VULKAN'
            if (providers.gradleProperty('gpuValidation').getOrElse('false').toBoolean()) {
                programArgs '--vulkanValidation'
            }
            def devWorld = providers.gradleProperty('devWorld')
            if (devWorld.isPresent()) {
                programArgs '--quickPlaySingleplayer', devWorld.get()
            }
        }
    }
}
